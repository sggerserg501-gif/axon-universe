<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OpenNeuroAtlas 3D — Clinical Anatomy Platform</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo"></div>
      <div>
        <h1>OpenNeuroAtlas <span class="badge">3D CLINICAL</span></h1>
        <p class="subtitle" id="ui-sub">Международная образовательная платформа клинической анатомии</p>
      </div>
    </div>

    <div class="topbar-controls">
      <div class="lang-switcher" id="lang-switcher">
        <button class="lang-btn active" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="es">ES</button>
        <button class="lang-btn" data-lang="de">DE</button>
        <button class="lang-btn" data-lang="zh">ZH</button>
      </div>
      <button class="btn-outline" id="btn-doctor">🩺 Режим врача</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <div class="panel-header" id="ui-mod-label">1. АНАТОМИЧЕСКИЙ РАЗДЕЛ</div>
      <nav class="section-list" id="section-list"></nav>
    </aside>
    <section class="viewport-container" id="viewport-container">
      <div id="canvas-3d"></div>
      <div id="labels-layer"></div>

      <div class="camera-toolbar">
        <button class="tool-btn" id="cam-front">Спереди</button>
        <button class="tool-btn" id="cam-side">Сбоку</button>
        <button class="tool-btn" id="cam-top">Сверху</button>
        <div class="divider"></div>
        <button class="tool-btn xray-btn" id="toggle-xray">🩻 Рентген</button>
        <button class="tool-btn" id="toggle-pause">⏸ Пауза</button>
        <button class="tool-btn" id="toggle-fs">⛶</button>
      </div>

      <div class="viewport-hint" id="ui-hint">ЛКМ — вращение • Колесико — масштаб</div>

      <div class="stage-selector" id="stage-selector">
        <button class="stage-btn active" data-stage="0" id="stage-btn-0"></button>
        <button class="stage-btn" data-stage="1" id="stage-btn-1"></button>
        <button class="stage-btn" data-stage="2" id="stage-btn-2"></button>
      </div>
    </section>

    <aside class="info-panel">
      <div class="clinical-card">
        <div class="status-pill" id="info-pill">Норма</div>
        <h2 id="info-title">Загрузка...</h2>
        <p class="clinical-desc" id="info-desc"></p>

        <div class="care-box">
          <div class="care-title" id="ui-tactics-label">Клиническая тактика:</div>
          <p id="info-tactics"></p>
        </div>

        <div class="author-meta">
          <span id="ui-author-label">Редактор / Консультант: </span>
          <strong id="info-author">OpenNeuroAtlas</strong>
        </div>
      </div>

      <footer class="medical-disclaimer" id="ui-disc"></footer>
    </aside>
  </main>

  <script src="data.js?v=6"></script>
  <script src="labels.js?v=6"></script>
  <script src="engine-core.js?v=6"></script>
  <script src="part1.js?v=6"></script>
  <script src="part2.js?v=6"></script>
  <script src="part3.js?v=6"></script>
  <script src="part4.js?v=6"></script>
  <script src="part5.js?v=6"></script>
  <script src="part6.js?v=6"></script>
  <script src="part7.js?v=6"></script>
  <script src="part8.js?v=6"></script>
  <script src="main.js?v=6"></script>
  <script src="three.min.js?v=6"></script>
  <script src="glb-data.js?v=6"></script>
  <script src="glb-work.js?v=7"></script>
  <script src="glb-boot.js?v=6"></script>

</body>
</html>
